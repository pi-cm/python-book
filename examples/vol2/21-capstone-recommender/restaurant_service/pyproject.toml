[project]
name = "restaurant-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [            # 미리 계산한 벡터로 추천하니 torch가 필요 없다
    "fastapi>=0.156",
    "uvicorn>=0.54",
    "numpy>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx2>=2.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
